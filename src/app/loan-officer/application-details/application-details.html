<!-- ACTION BAR -->
<div class="bg-white border border-slate-200 rounded-xl p-5 md:col-span-2 flex justify-end gap-3">

    <button *ngIf="canApprove" class="bg-green-600 text-white px-4 py-2 rounded" (click)="openModal('APPROVE')">
        Approve Loan
    </button>

    <button *ngIf="canReject" class="bg-red-600 text-white px-4 py-2 rounded" (click)="openModal('REJECT')">
        Reject Applicationsss
    </button>

</div>

<!-- STATUS TIMELINE -->
<div class="bg-white border border-slate-200 rounded-xl p-6 mb-8">
    <h3 class="text-sm font-semibold text-slate-700 mb-6 uppercase tracking-wide">
        Application Status
    </h3>

    <div class="flex items-center justify-between">

        <div *ngFor="let step of uiStages; let last = last" class="flex items-center flex-1">

            <!-- Status Dot -->
            <div class="w-3.5 h-3.5 rounded-full" [ngClass]="{
    'bg-emerald-600': isStageCompleted(step.key),
    'bg-indigo-600 ring-4 ring-indigo-100':
      step.key === currentStage,
    'bg-slate-300':
      !isStageCompleted(step.key) && step.key !== currentStage
  }"></div>


            <!-- Label -->
            <span class="ml-3 text-sm" [ngClass]="
                    isStageCompleted(step.key)
                        ? 'text-slate-800 font-medium'
                        : 'text-slate-500'
                ">
                {{ step.label }}
            </span>

            <!-- Connector -->
            <div *ngIf="!last" class="flex-1 h-px mx-4" [ngClass]="
                    isStageCompleted(step.key)
                        ? 'bg-emerald-600'
                        : 'bg-slate-300'
                ">
            </div>

        </div>

    </div>
</div>

<!-- DOCUMENT PREVIEW -->
<div class="bg-white border border-slate-200 rounded-xl p-6 md:col-span-2">

    <h3 class="text-sm font-semibold text-slate-700 mb-6 uppercase tracking-wide">
        Uploaded Documents
    </h3>

    <div class="grid md:grid-cols-3 gap-4">

        <div *ngFor="let doc of documents" class="border border-slate-200 rounded-lg p-4
                    hover:border-slate-300 transition cursor-pointer">

            <p class="text-sm font-medium text-slate-800">
                {{ doc.name }}
            </p>

            <p class="text-xs text-slate-500 mt-1">
                Click to preview
            </p>

            <button class="mt-4 text-sm font-medium text-indigo-600 hover:text-indigo-700 transition">
                View Document
            </button>

        </div>

    </div>
</div>

<app-decision-modal *ngIf="showModal" [action]="action!" (close)="closeModal()" (confirm)="confirmDecision()">
</app-decision-modal>
