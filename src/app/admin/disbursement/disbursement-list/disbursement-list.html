<section class="max-w-[1400px] mx-auto px-6 py-10 space-y-8">

  <!-- ================= HEADER ================= -->
  <div class="bg-white rounded-3xl shadow-xl border border-slate-200 p-8">
    <h1 class="text-3xl font-bold text-slate-900">
      Disbursement Authorization
    </h1>
    <p class="text-sm text-slate-500 mt-1">
      Review and authorize approved loan disbursements
    </p>
  </div>

  <!-- ================= TABLE CARD ================= -->
  <div class="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden">

    <!-- TABLE HEADER STRIP -->
    <div class="px-6 py-4 bg-slate-50 border-b border-slate-200">
      <p class="text-sm font-medium text-slate-700">
        Pending Disbursements
      </p>
    </div>

    <!-- TABLE -->
    <div class="overflow-x-auto">
      <table class="w-full">

        <thead class="bg-slate-100 text-left text-xs uppercase tracking-wide text-slate-500">
          <tr>
            <th class="px-6 py-4">Application</th>
            <th class="px-6 py-4">Applicant</th>
            <th class="px-6 py-4">Amount</th>
            <th class="px-6 py-4">Bank</th>
            <th class="px-6 py-4 text-right">Action</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let d of disbursements"
              class="border-t hover:bg-slate-50 transition">

            <td class="px-6 py-4 font-medium text-slate-800">
              {{ d.id }}
            </td>

            <td class="px-6 py-4 text-slate-700">
              {{ d.applicant }}
            </td>

            <td class="px-6 py-4 font-semibold text-slate-800">
              ₹{{ d.amount }}
            </td>

            <td class="px-6 py-4 text-slate-700">
              {{ d.bank }}
            </td>

            <td class="px-6 py-4 text-right">
              <button
                class="px-5 py-2 rounded-xl
                       bg-emerald-600 text-white text-sm font-medium
                       hover:bg-emerald-700
                       shadow-lg shadow-emerald-600/30
                       transition"
                (click)="openConfirm(d.id)">
                Authorize
              </button>
            </td>

          </tr>
        </tbody>

      </table>
    </div>
  </div>

  <!-- ================= CONFIRM MODAL ================= -->
  <div *ngIf="selectedId"
       class="fixed inset-0 bg-black/50 backdrop-blur-sm
              flex items-center justify-center z-50">

    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8">

      <h3 class="text-xl font-semibold text-slate-900 mb-2">
        Confirm Disbursement
      </h3>

      <p class="text-slate-600 mb-8">
        Are you sure you want to authorize disbursement for
        <span class="font-medium text-slate-800">{{ selectedId }}</span>?
      </p>

      <div class="flex justify-end gap-4">
        <button
          class="px-5 py-2 rounded-xl text-slate-700
                 hover:bg-slate-100 transition"
          (click)="cancel()">
          Cancel
        </button>

        <button
          class="px-5 py-2 rounded-xl
                 bg-emerald-600 text-white font-semibold
                 hover:bg-emerald-700 transition"
          (click)="confirm()">
          Confirm Authorization
        </button>
      </div>

    </div>
  </div>

</section>
