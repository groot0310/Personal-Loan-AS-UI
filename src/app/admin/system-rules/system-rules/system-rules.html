<h2 class="text-3xl font-bold mb-2">System Rules</h2>
<p class="text-slate-500 mb-8">
    Configure loan eligibility, limits, and financial rules. Changes apply to all new applications.
</p>

<div class="bg-white p-8 rounded-2xl shadow-lg max-w-2xl border border-slate-200">

    <!-- Max Loan Amount -->
    <div class="mb-6">
        <label class="block text-sm font-semibold text-slate-700 mb-2">
            Maximum Loan Amount (₹)
        </label>
        <input type="number" [(ngModel)]="rules.maxLoanAmount" class="w-full border border-slate-300 rounded-lg px-4 py-2
                   focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g. 1000000" />
        <p class="text-xs text-slate-500 mt-1">
            Maximum amount a user can apply for.
        </p>
    </div>

    <!-- Minimum Credit Score -->
    <div class="mb-6">
        <label class="block text-sm font-semibold text-slate-700 mb-2">
            Minimum Credit Score
        </label>
        <input type="number" [(ngModel)]="rules.minCreditScore" class="w-full border border-slate-300 rounded-lg px-4 py-2
                   focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g. 650" />
        <p class="text-xs text-slate-500 mt-1">
            Applications below this score will be auto-rejected.
        </p>
    </div>

    <!-- Max Tenure -->
    <div class="mb-6">
        <label class="block text-sm font-semibold text-slate-700 mb-2">
            Maximum Tenure (Months)
        </label>
        <input type="number" [(ngModel)]="rules.maxTenure" class="w-full border border-slate-300 rounded-lg px-4 py-2
                   focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g. 60" />
        <p class="text-xs text-slate-500 mt-1">
            Longest repayment period allowed.
        </p>
    </div>

    <!-- Interest Rate -->
    <div class="mb-8">
        <label class="block text-sm font-semibold text-slate-700 mb-2">
            Base Interest Rate (%)
        </label>
        <input type="number" step="0.1" [(ngModel)]="rules.interestRate" class="w-full border border-slate-300 rounded-lg px-4 py-2
                   focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g. 11.5" />
        <p class="text-xs text-slate-500 mt-1">
            Final rate may vary based on risk profile.
        </p>
    </div>

    <!-- Actions -->
    <div class="flex justify-end gap-4">
        <button class="px-6 py-2 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-100">
            Cancel
        </button>

        <button class="bg-indigo-600 text-white px-6 py-2 rounded-lg
                   hover:bg-indigo-700 transition" (click)="save()">
            Save Rules
        </button>
    </div>

</div>
