<section class="max-w-[1400px] mx-auto px-6 py-10 space-y-8">

    <!-- ================= HEADER ================= -->
    <div class="bg-white rounded-3xl shadow-xl border border-slate-200 p-8">
        <h1 class="text-3xl font-bold text-slate-900">
            Application Details
        </h1>
        <p class="text-sm text-slate-500 mt-1">
            Application ID — <span class="font-medium">{{ applicationId }}</span>
        </p>
    </div>

    <!-- ================= SUMMARY ================= -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">

        <div class="bg-white rounded-2xl border border-slate-200 shadow p-6">
            <p class="text-xs text-slate-500 uppercase mb-1">Applicant</p>
            <p class="text-lg font-semibold text-slate-800">
                {{ application.applicant }}
            </p>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 shadow p-6">
            <p class="text-xs text-slate-500 uppercase mb-1">Loan Amount</p>
            <p class="text-lg font-semibold text-slate-800">
                ₹{{ application.amount }}
            </p>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 shadow p-6">
            <p class="text-xs text-slate-500 uppercase mb-1">Tenure</p>
            <p class="text-lg font-semibold text-slate-800">
                {{ application.tenure }} months
            </p>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 shadow p-6">
            <p class="text-xs text-slate-500 uppercase mb-1">Credit Score</p>
            <p class="text-lg font-semibold text-slate-800">
                {{ application.creditScore }}
            </p>
        </div>

    </div>

    <!-- ================= OFFICER REMARK ================= -->
    <div class="bg-white rounded-3xl border border-slate-200 shadow p-8">
        <h3 class="text-lg font-semibold text-slate-900 mb-3">
            Loan Officer Remark
        </h3>

        <div class="bg-slate-50 rounded-xl p-5 text-slate-700 leading-relaxed">
            {{ application.officerRemark }}
        </div>
    </div>

    <!-- ================= FINAL ACTIONS ================= -->
    <div class="bg-white rounded-3xl border border-slate-200 shadow
               p-6 flex flex-col sm:flex-row gap-4 justify-end">

        <button class="px-6 py-3 rounded-xl font-semibold text-white
                   bg-red-600 hover:bg-red-700 transition" (click)="reject()">
            Reject Application
        </button>

        <button class="px-6 py-3 rounded-xl font-semibold text-white
                   bg-green-600 hover:bg-green-700 transition" (click)="approve()">
            Approve & Send for Disbursement
        </button>

    </div>

</section>
