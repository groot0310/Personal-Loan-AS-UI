<section class="p-8 space-y-6">

    <h1 class="text-2xl font-bold">
        Application Details — {{ applicationId }}
    </h1>

    <!-- SUMMARY -->
    <div class="bg-white p-6 rounded-xl shadow grid md:grid-cols-2 gap-4">
        <p><strong>Applicant:</strong> {{ application.applicant }}</p>
        <p><strong>Loan Amount:</strong> ₹{{ application.amount }}</p>
        <p><strong>Tenure:</strong> {{ application.tenure }} months</p>
        <p><strong>Credit Score:</strong> {{ application.creditScore }}</p>
    </div>

    <!-- OFFICER REMARK -->
    <div class="bg-white p-6 rounded-xl shadow">
        <h3 class="font-semibold mb-2">Loan Officer Remark</h3>
        <p class="text-slate-700">{{ application.officerRemark }}</p>
    </div>

    <!-- FINAL ACTIONS -->
    <div class="bg-white p-6 rounded-xl shadow flex gap-4 justify-end">
        <button class="bg-green-600 text-white px-4 py-2 rounded" (click)="approve()">
            Approve & Send for Disbursement
        </button>

        <button class="bg-red-600 text-white px-4 py-2 rounded" (click)="reject()">
            Reject Application
        </button>
    </div>

</section>
