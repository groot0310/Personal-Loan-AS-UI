<section class="max-w-[1400px] mx-auto px-6 py-10 space-y-8">

    <!-- ================= HEADER ================= -->
    <div class="bg-white rounded-3xl shadow-xl border border-slate-200 p-8">
        <h1 class="text-3xl font-bold text-slate-900">
            Loan Applications
        </h1>
        <p class="text-sm text-slate-500 mt-1">
            Review, approve, or reject loan applications submitted by users
        </p>
    </div>

    <!-- ================= FILTER BAR ================= -->
    <div class="bg-white rounded-2xl shadow border border-slate-200 p-6 flex items-center gap-4">
        <span class="text-sm font-medium text-slate-600">
            Filter by status:
        </span>

        <select
            class="px-4 py-2 rounded-xl border border-slate-300
                   text-sm text-slate-700 bg-white
                   focus:outline-none focus:ring-2 focus:ring-indigo-500"
            [(ngModel)]="statusFilter">

            <option value="ALL">All Status</option>
            <option value="PENDING_ADMIN">Pending Admin</option>
            <option value="APPROVED">Approved</option>
            <option value="REJECTED">Rejected</option>
        </select>
    </div>

    <!-- ================= TABLE CARD ================= -->
   <app-loan-officer-applications></app-loan-officer-applications>

</section>
