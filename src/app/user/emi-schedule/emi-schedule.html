<h2 class="text-2xl font-bold mb-6">EMI Schedule</h2>

<table class="w-full bg-white rounded-xl shadow overflow-hidden">
    <thead class="bg-gray-100">
        <tr>
            <th class="p-3 text-left">Month</th>
            <th class="p-3 text-left">Amount</th>
            <th class="p-3 text-left">Status</th>
            <th class="p-3 text-left">Action</th>
        </tr>
    </thead>

    <tbody>
        <tr *ngFor="let emi of emis" class="border-t">
            <td class="p-3">{{ emi.month }}</td>

            <td class="p-3">₹{{ emi.amount }}</td>

            <td class="p-3">
                <span class="px-2 py-1 rounded text-sm" [ngClass]="{
            'bg-green-100 text-green-700': emi.status === 'PAID',
            'bg-yellow-100 text-yellow-700': emi.status === 'DUE',
            'bg-gray-200 text-gray-600': emi.status === 'UPCOMING'
          }">
                    {{ emi.status }}
                </span>
            </td>

            <td class="p-3">
                <button *ngIf="emi.status === 'DUE'" (click)="payEmi(emi)"
                    class="bg-green-600 text-white px-4 py-1 rounded hover:bg-green-700">
                    Pay EMI
                </button>

                <span *ngIf="emi.status !== 'DUE'" class="text-gray-400">
                    —
                </span>
            </td>
        </tr>
    </tbody>
</table>
