<section class="p-8 bg-slate-100 min-h-screen">

    <!-- WELCOME -->
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-slate-800">
            Welcome back 👋
        </h1>
        <p class="text-slate-500 mt-1">
            Here’s the current status of your personal loan application
        </p>
    </div>

    

    <!-- MAIN STATUS CARD -->
    <div class="bg-white rounded-2xl shadow border border-slate-200 p-6 mb-8">

        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-6">

            <!-- LEFT -->
            <div>
                <p class="text-sm uppercase tracking-wide text-slate-500 mb-1">
                    Current Loan Status
                </p>

                <h2 class="text-2xl font-semibold text-slate-800">
                    {{ currentStatusLabel }}
                </h2>

                <p class="text-slate-500 mt-2 max-w-lg">
                    {{ statusDescription }}
                </p>
            </div>

            <!-- PRIMARY ACTION -->
            <div *ngIf="primaryActionLabel" class="flex-shrink-0">
                <button [routerLink]="primaryActionRoute" class="bg-indigo-600 text-white px-6 py-3 rounded-xl font-medium
                           hover:bg-indigo-700 transition shadow">
                    {{ primaryActionLabel }}
                </button>
            </div>

        </div>

    </div>

    <!-- TIMELINE PREVIEW -->
    <div class="bg-white rounded-2xl shadow border border-slate-200 p-6 mb-8">

        <h3 class="text-sm font-semibold text-slate-700 mb-5 uppercase tracking-wide">
            Application Progress
        </h3>

        <app-application-timeline [currentStage]="currentStage">
        </app-application-timeline>

    </div>

    <!-- INFO CARDS -->
    <div class="grid md:grid-cols-3 gap-6">

        <!-- LOAN AMOUNT -->
        <div class="bg-white rounded-xl shadow border border-slate-200 p-5">
            <p class="text-sm text-slate-500">Loan Amount</p>
            <p class="text-2xl font-bold text-slate-800 mt-1">
                ₹5,00,000
            </p>
        </div>

        <!-- TENURE -->
        <div class="bg-white rounded-xl shadow border border-slate-200 p-5">
            <p class="text-sm text-slate-500">Tenure</p>
            <p class="text-2xl font-bold text-slate-800 mt-1">
                36 Months
            </p>
        </div>

        <!-- EMI -->
        <div class="bg-white rounded-xl shadow border border-slate-200 p-5">
            <p class="text-sm text-slate-500">Estimated EMI</p>
            <p class="text-2xl font-bold text-slate-800 mt-1">
                ₹16,200
            </p>
        </div>

    </div>

</section>
