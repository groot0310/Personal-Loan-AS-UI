<h2 class="text-2xl font-bold mb-4">
    Loan Details — {{ loanId }}
</h2>

<div class="bg-white p-6 rounded-xl shadow mb-6">
    <app-application-timeline [currentStage]="currentStage"></app-application-timeline>
</div>

<div class="bg-white p-6 rounded-xl shadow">
    <h3 class="text-lg font-semibold mb-4">Loan Summary</h3>

    <p><strong>Status:</strong> {{ currentStatus }}</p>
    <p><strong>Amount:</strong> ₹5,00,000</p>
    <p><strong>Tenure:</strong> 36 months</p>
</div>

<div class="bg-white p-6 rounded-xl shadow mt-6">
    <h3 class="text-lg font-semibold mb-4">Next Actions</h3>

    <div class="flex gap-4">
        <button *ngIf="canUploadDocuments" [routerLink]="['/user/upload-documents', loanId]"
            class="bg-blue-600 text-white px-4 py-2 rounded">
            Upload Documents
        </button>

        <button *ngIf="canPayEmi" [routerLink]="['/user/pay-emi', loanId]"
            class="bg-green-600 text-white px-4 py-2 rounded">
            Pay EMI
        </button>


        <span *ngIf="!canUploadDocuments && !canPayEmi" class="text-gray-500">
            No actions available at this stage
        </span>
    </div>
</div>

<div class="bg-white p-6 rounded-xl shadow mt-6">
    <h3 class="text-lg font-semibold mb-4">Uploaded Documents</h3>

    <table class="w-full">
        <tr class="border-b text-left">
            <th class="py-2">Document</th>
            <th>Status</th>
        </tr>

        <tr *ngFor="let doc of documents" class="border-b">
            <td class="py-2">{{ doc.name }}</td>
            <td>
                <span class="px-2 py-1 rounded text-sm" [ngClass]="{
            'bg-green-100 text-green-700': doc.status === 'APPROVED',
            'bg-yellow-100 text-yellow-700': doc.status === 'PENDING',
            'bg-red-100 text-red-700': doc.status === 'REJECTED'
          }">
                    {{ doc.status }}
                </span>
            </td>
        </tr>
    </table>
</div>
