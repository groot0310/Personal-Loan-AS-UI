<div class="min-h-screen flex items-center justify-center
            bg-gradient-to-br from-neutral-900 via-slate-900 to-stone-900 relative px-4">

    <!-- ambient shapes -->
    <div class="absolute -top-32 -left-32 w-[500px] h-[500px]
                bg-stone-700/20 rounded-full blur-3xl"></div>
    <div class="absolute bottom-0 right-0 w-[400px] h-[400px]
                bg-slate-700/20 rounded-full blur-3xl"></div>

    <!-- REGISTER CARD -->
    <div class="relative w-full max-w-md rounded-2xl
                bg-stone-50 shadow-[0_25px_80px_-15px_rgba(0,0,0,0.6)]
                p-10">

        <!-- paper grain -->
        <div class="absolute inset-0 rounded-2xl
                    bg-gradient-to-br from-white/60 to-transparent"></div>

        <!-- CONTENT -->
        <div class="relative z-10">

            <!-- BRAND -->
            <div class="mb-10 text-center">
                <h2 class="text-3xl font-semibold tracking-tight text-stone-900">
                    CrediFlow
                </h2>
                <p class="text-xs uppercase tracking-widest text-stone-500 mt-1">
                    Internal Loan System
                </p>
            </div>

            <!-- COPY -->
            <div class="mb-6 text-center">
                <h3 class="text-xl font-medium text-stone-800">
                    Create Your Account
                </h3>
                <p class="text-sm text-stone-500 mt-1">
                    Secure registration for loan officers
                </p>
            </div>

            <!-- FORM -->
            <form [formGroup]="registerForm" (ngSubmit)="submit()" class="space-y-4">

                <input type="text" formControlName="fullName" placeholder="Full Name" class="w-full px-4 py-3 rounded-lg bg-transparent border border-stone-300
                              text-stone-900 placeholder-stone-400
                              focus:outline-none focus:border-stone-600
                              transition" />

                <input type="email" formControlName="email" placeholder="Email" class="w-full px-4 py-3 rounded-lg bg-transparent border border-stone-300
                              text-stone-900 placeholder-stone-400
                              focus:outline-none focus:border-stone-600
                              transition" />

                <input type="tel" formControlName="mobileNumber" placeholder="Mobile Number" class="w-full px-4 py-3 rounded-lg bg-transparent border border-stone-300
                              text-stone-900 placeholder-stone-400
                              focus:outline-none focus:border-stone-600
                              transition" />

                <input type="date" formControlName="dateOfBirth" class="w-full px-4 py-3 rounded-lg bg-transparent border border-stone-300
                              text-stone-900 placeholder-stone-400
                              focus:outline-none focus:border-stone-600
                              transition" />

                <textarea formControlName="address" placeholder="Address" rows="3" class="w-full px-4 py-3 rounded-lg bg-transparent border border-stone-300
                                 text-stone-900 placeholder-stone-400
                                 focus:outline-none focus:border-stone-600
                                 transition"></textarea>

                <input type="password" formControlName="password" placeholder="Password" class="w-full px-4 py-3 rounded-lg bg-transparent border border-stone-300
                              text-stone-900 placeholder-stone-400
                              focus:outline-none focus:border-stone-600
                              transition" />

                <input type="password" formControlName="confirmPassword" placeholder="Confirm Password" class="w-full px-4 py-3 rounded-lg bg-transparent border border-stone-300
                              text-stone-900 placeholder-stone-400
                              focus:outline-none focus:border-stone-600
                              transition" />

                <button type="submit" class="w-full mt-4 py-3 rounded-lg
                               bg-stone-900 text-stone-100
                               font-medium tracking-wide
                               hover:bg-black
                               transition">
                    Create Account
                </button>
            </form>

            <!-- FOOTER -->
            <p class="text-xs text-stone-500 mt-6 text-center">
                Already have an account?
                <a routerLink="/login" class="text-stone-800 font-medium hover:underline">
                    Sign in
                </a>
            </p>

            <!-- BACK TO HOME -->
            <div class="mt-4 text-center">
                <a routerLink="/" class="text-stone-600 text-sm hover:text-stone-800 transition">
                    ← Back to Home
                </a>
            </div>

        </div>
    </div>
</div>
